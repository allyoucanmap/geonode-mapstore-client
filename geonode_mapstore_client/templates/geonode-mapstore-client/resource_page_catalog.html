{% extends "page.html" %} 
{% load i18n %}
{% block container %}

    <div class="gn-resource-page-catalog">
        {% block content %}
        {% endblock content %}
    </div>

    <script>
        (function(){

            let msPluginsBlocks = [];
            // TODO: function getPageFilterForm() {}

            {% block ms_plugins %}
            {% endblock ms_plugins %}
            if (msPluginsBlocks) {
                window.addEventListener("mapstore:ready", function (event) {
                    const catalogPagePath = window.__GEONODE_CONFIG__.localConfig.geoNodeSettings.catalogPagePath;
                    const pagePath = catalogPagePath ? catalogPagePath : "/catalogue/";
                    const msAPI = event.detail;
                    const configurablePlugins = ['ResourcesGrid', 'ResourcesFiltersForm'];
                    msAPI.setPluginsConfig((localConfig) => {
                        const catalogue = (localConfig?.plugins?.catalogue || []);
                        const defaultConfig = configurablePlugins.reduce((acc, key) => {
                            acc[key] = catalogue.find(plugin => plugin.name === key)?.cfg || {};
                            delete acc[key].titleId;
                            return acc;
                        }, {});
                        return [
                            ...catalogue.filter(plugin => !configurablePlugins.includes(plugin.name)),
                            ...msPluginsBlocks.map(msPluginBlock => {
                                return {
                                    name: msPluginBlock.name,
                                    cfg: Object.assign({},
                                        defaultConfig[msPluginBlock.name],
                                        msPluginBlock?.cfg,
                                        { targetSelector: `#${msPluginBlock.id}` }
                                    )
                                };
                            })
                        ];
                    });
                });
            }
        })();
    </script>
{% endblock %}
